<!doctype html>
<html lang="en" data-notice-key="port0-app:testnet-disclaimer:v1">
<head>
  <meta charset="UTF-8" />
  <title>%VITE_BRAND_MARK_TEXT% Pools</title>
  <meta name="description" content="Browse, swap on, and provide liquidity to port0.sh constant-product pools on Miden." />
  <link rel="canonical" href="%VITE_SITE_URL%/" />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta property="og:site_name" content="%VITE_BRAND_NAME%" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:title" content="%VITE_BRAND_TAGLINE%" />
  <meta property="og:description" content="%VITE_BRAND_DESCRIPTION%" />
  <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="%VITE_BRAND_TAGLINE%" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="%VITE_BRAND_X_HANDLE%" />
  <meta name="twitter:title" content="%VITE_BRAND_TAGLINE%" />
  <meta name="twitter:description" content="%VITE_BRAND_DESCRIPTION%" />
  <meta name="twitter:image" content="%VITE_SITE_URL%/twitter-card.png" />
  <meta name="twitter:image:alt" content="%VITE_BRAND_TAGLINE%" />
  <link rel="stylesheet" href="/src/styles/global.css" />
  <script>
    // Hides the testnet notice before the first paint when it was dismissed.
    try {
      if (localStorage.getItem(document.documentElement.dataset.noticeKey) === '1') {
        document.documentElement.dataset.notice = 'dismissed'
      }
    } catch {
      // Storage unavailable: the notice stays visible, which is the safe default.
    }
  </script>
</head>
<body data-page="Pools">

  <div id="testnet-notice">
    <p>
      <strong class="error">Miden testnet only.</strong> These tokens have no value, the network
      can be reset, and the contracts can change. Do not send mainnet assets. Nothing here is
      financial advice.
    </p>
    <button type="button" class="btn" id="notice-dismiss">Dismiss</button>
  </div>

  <main class="container">
    <div id="site-banner" hidden></div>

    <h1 id="brand-heading">%VITE_BRAND_NAME%</h1>

    <div class="hero-cta">
      <a class="btn" href="/create.html">Launch a pool</a>
    </div>

    <p class="brand-slogan" id="brand-slogan" hidden></p>

    <div class="menu-row">
      <nav class="nav" aria-label="Sections">
        <a href="/" class="active" aria-current="page">Pools</a>
        <a href="/create.html">Launch</a>
        <a href="/about.html">About</a>
      </nav>
      <div class="wallet" id="wallet" aria-live="polite">
        <button type="button" class="btn btn-primary">Login</button>
      </div>
    </div>

    <section class="panel">
      <div class="toolbar">
        <span class="toolbar-left">
          <input
            id="pool-filter"
            type="search"
            placeholder="filter by faucet id"
            spellcheck="false"
            aria-label="Filter pools by token faucet id"
          />
          <span class="muted" id="pool-count">Loading pools…</span>
        </span>
        <span class="toolbar-actions">
          <span class="muted mono" id="refresh-status"></span>
          <button type="button" class="btn" id="refresh-states">Refresh</button>
        </span>
      </div>
      <div id="pool-table" class="table-wrap">Loading…</div>
      <div class="form-actions">
        <button type="button" class="btn" id="load-more" hidden>Load more</button>
      </div>
    </section>
  </main>

  <footer class="footer">Copyright © <span id="footer-year">2026</span> <span id="footer-brand">%VITE_BRAND_NAME%</span></footer>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/pages/home.ts"></script>
</body>
</html>
