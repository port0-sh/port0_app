<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Miden XYK — Pools</title>
  <meta name="description" content="Browse, swap on, and provide liquidity to MidenXYK constant-product pools on Miden." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>
<body>
  <header class="header">
    <a class="brand" href="/">
      <img src="/favicon.svg" alt="" class="brand-logo" width="28" height="28" />
      <span class="brand-name">MIDEN<span class="accent">XYK</span></span>
    </a>
    <nav class="nav">
      <a href="/" class="active" aria-current="page">Pools</a>
      <a href="/create.html">Launch</a>
      <a href="/about.html">About</a>
    </nav>
    <div class="wallet" id="wallet" aria-live="polite">
      <button type="button" class="btn btn-primary">Login</button>
    </div>
  </header>

  <main class="container">
    <header class="page-head">
      <h1>Pools</h1>
      <p class="lede">
        Constant-product pools on Miden. Every swap pays a fee to the pool's liquidity
        providers, and that fee stays in the reserves they own.
      </p>
    </header>

    <section class="panel">
      <div class="toolbar">
        <span class="toolbar-left">
          <input
            id="pool-filter"
            type="search"
            placeholder="filter by faucet id"
            spellcheck="false"
            aria-label="Filter pools by token faucet id"
          />
          <span class="muted" id="pool-count">Loading pools…</span>
        </span>
        <span class="toolbar-actions">
          <span class="muted mono" id="refresh-status"></span>
          <button type="button" class="btn" id="refresh-states">Refresh</button>
        </span>
      </div>
      <div id="pool-table" class="table-wrap">Loading…</div>
      <div class="form-actions">
        <button type="button" class="btn" id="load-more" hidden>Load more</button>
      </div>
    </section>
  </main>

  <footer class="footer">Copyright © <span id="footer-year">2026</span> MidenXYK</footer>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/pages/home.ts"></script>
</body>
</html>
